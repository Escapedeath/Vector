name: Build Vector 3112

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VECTOR_BUILD_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout canary-3112
        uses: actions/checkout@v6
        with:
          repository: JingMatrix/Vector
          ref: canary-3112
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Fix historical version references
        shell: bash
        run: |
          set -euo pipefail

          # Version code is calculated from origin/master.
          git update-ref refs/remotes/origin/master "$(git rev-parse HEAD)"

          # Remove tags from later commits in this temporary checkout.
          while IFS= read -r tag; do
            [ -z "$tag" ] || git tag -d "$tag"
          done < <(git tag --no-merged HEAD)

          COUNT=$(git rev-list --count refs/remotes/origin/master)
          VERSION=$(git tag --list --sort=-v:refname | sed -n '1p')

          echo "Version code: $COUNT"
          echo "Version tag: $VERSION"
          git log -1 --format='%H %s'

          if [ "$COUNT" != "3112" ]; then
            echo "::error::Expected version code 3112, got $COUNT"
            exit 1
          fi

          if [ "$VERSION" != "v2.2" ]; then
            echo "::error::Expected version tag v2.2, got $VERSION"
            exit 1
          fi

          echo "VECTOR_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370

      - name: Setup CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/vector-build-tools"
          "$RUNNER_TEMP/vector-build-tools/bin/python" -m pip install \
            "cmake==3.31.6" ninja

          echo "$RUNNER_TEMP/vector-build-tools/bin" >> "$GITHUB_PATH"

          # Match upstream CI: use CMake from PATH.
          if [ -d "$ANDROID_HOME/cmake" ]; then
            rm -rf "$ANDROID_HOME/cmake"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-vector3112-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-vector3112-gradle-

      - name: Configure build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.parallel=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          EOF

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          java -version
          cmake --version
          ninja --version

      - name: Check translations
        run: |
          python3 manager/tools/check_translations.py manager/src/main/res
          python3 manager/tools/check_translations.py daemon/src/main/res

      - name: Build Vector modules
        run: ./gradlew :zygisk:zipAll --no-daemon --stacktrace

      - name: Prepare module artifacts
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ZIP="zygisk/release/Vector-v2.2-3112-Release.zip"
          DEBUG_ZIP="zygisk/release/Vector-v2.2-3112-Debug.zip"

          test -f "$RELEASE_ZIP"
          test -f "$DEBUG_ZIP"

          mkdir -p artifacts/release artifacts/debug

          unzip -q "$RELEASE_ZIP" -d artifacts/release
          unzip -q "$DEBUG_ZIP" -d artifacts/debug

          sha256sum "$RELEASE_ZIP" "$DEBUG_ZIP"

      - name: Upload Release module
        uses: actions/upload-artifact@v4
        with:
          name: Vector-v2.2-3112-Release
          path: artifacts/release/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Debug module
        uses: actions/upload-artifact@v4
        with:
          name: Vector-v2.2-3112-Debug
          path: artifacts/debug/
          include-hidden-files: true
          if-no-files-found: error
